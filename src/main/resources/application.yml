spring:
  datasource:
    url: jdbc:mysql://localhost:3306/linkedknowledge?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root            #将在本地运行的mysql设计成有网址是因为方便其他人在这个面调用数据
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  jackson:
    default-encoding: UTF-8
    encoding: UTF-8

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: 8ezLNia/ik8/HoB94SBHwcjijvLcfYFSDbb4b2nFM48=

auth:
  cookie:
    name: token
    http-only: true
    secure: false
    same-site: Lax
    path: /
    max-age-seconds: 604800

sms:
  cooldown-seconds: 60
  ttl-seconds: 300
  max-fails: 5
  webhook-url: ${SMS_WEBHOOK:}
  dev-echo: true

# 大模型配置
# 注意：key 用 yml 的双引号包起来防止 yaml alias 解析
llm:
  api-key: "${LLM_API_KEY:PLACEHOLDER_PUT_REAL_KEY_HERE}"
  base-url: https://api.minimaxi.com/v1
  model: MiniMax-Text-01
  timeout-seconds: 60